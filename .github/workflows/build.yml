name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev lld ccache

    - name: Install Buildozer and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.36 virtualenv buildozer

    # Cache Buildozer and Gradle state to speed up subsequent workflow runs
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Compile APK via Buildozer
      run: |
        # Force buildozer to use the runner's pre-installed SDK/NDK and stable Gradle home
        buildozer -v android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "y"
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle
        GRADLE_USER_HOME: /home/runner/.gradle

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Chat-APK
        # Buildozer outputs to bin/, using **/*.apk handles potential pathing quirks safely
        path: bin/*.apk
